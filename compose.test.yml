name: pg-oauth-validator-test

services:
  pg15:
    image: pg-oauth-validator-dev:pg15
    build:
      context: .
      dockerfile: tools/dev/Containerfile
      args:
        PG_MAJOR: "15"
        POSTGRES_IMAGE: postgres:15.20-bookworm@sha256:8180c3e1b9b603d2988f937dfbe51008bad5c4b07c77f35119695c027a7315ab
    working_dir: /workspace
    environment:
      BUILD_ROOT: /build
      PG_CONFIG_PATH: /usr/lib/postgresql/15/bin/pg_config
      PG_MAJOR: "15"
    volumes:
      - .:/workspace:ro
      - pg15-build:/build
    tmpfs:
      - /source
    entrypoint:
      - /bin/sh
      - /workspace/tools/dev/run-tests.sh
    command:
      - pam-check-pg15

  pg16:
    image: pg-oauth-validator-dev:pg16
    build:
      context: .
      dockerfile: tools/dev/Containerfile
      args:
        PG_MAJOR: "16"
        POSTGRES_IMAGE: postgres:16.16-bookworm@sha256:ce3efec6bc404f6b15ebf5d9bed6b45a9d4655aea238d7dacc3467ccb05a1175
    working_dir: /workspace
    environment:
      BUILD_ROOT: /build
      PG_CONFIG_PATH: /usr/lib/postgresql/16/bin/pg_config
      PG_MAJOR: "16"
    volumes:
      - .:/workspace:ro
      - pg16-build:/build
    tmpfs:
      - /source
    entrypoint:
      - /bin/sh
      - /workspace/tools/dev/run-tests.sh
    command:
      - pam-check-pg16

  pg17:
    image: pg-oauth-validator-dev:pg17
    build:
      context: .
      dockerfile: tools/dev/Containerfile
      args:
        PG_MAJOR: "17"
        POSTGRES_IMAGE: postgres:17.12-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
    working_dir: /workspace
    environment:
      BUILD_ROOT: /build
      PG_CONFIG_PATH: /usr/lib/postgresql/17/bin/pg_config
      PG_MAJOR: "17"
    volumes:
      - .:/workspace:ro
      - pg17-build:/build
    tmpfs:
      - /source
    entrypoint:
      - /bin/sh
      - /workspace/tools/dev/run-tests.sh
    command:
      - pam-check-pg17

  pg18:
    image: pg-oauth-validator-dev:pg18
    build:
      context: .
      dockerfile: tools/dev/Containerfile
      args:
        PG_MAJOR: "18"
        POSTGRES_IMAGE: postgres:18.7-bookworm@sha256:194e55feb2597b1465dbee81cc9fd8d204566cd2eb42c8d22fd6c931a38781b1
    working_dir: /workspace
    environment:
      BUILD_ROOT: /build
      PG_CONFIG_PATH: /usr/lib/postgresql/18/bin/pg_config
      PG_MAJOR: "18"
    volumes:
      - .:/workspace:ro
      - pg18-build:/build
    tmpfs:
      - /source
    entrypoint:
      - /bin/sh
      - /workspace/tools/dev/run-tests.sh
    command:
      - dev-test-pg18

  pg19:
    image: pg-oauth-validator-dev:pg19
    build:
      context: .
      dockerfile: tools/dev/Containerfile
      args:
        PG_MAJOR: "19"
        POSTGRES_IMAGE: postgres:19.0-bookworm@sha256:f4859caf96de494e38efa69ed703b08a5bbd9605e152e604f2daec8841c87c41
    working_dir: /workspace
    environment:
      BUILD_ROOT: /build
      PG_CONFIG_PATH: /usr/lib/postgresql/19/bin/pg_config
      PG_MAJOR: "19"
    volumes:
      - .:/workspace:ro
      - pg19-build:/build
    tmpfs:
      - /source
    entrypoint:
      - /bin/sh
      - /workspace/tools/dev/run-tests.sh
    command:
      - dev-test-pg19

volumes:
  pg15-build:
  pg16-build:
  pg17-build:
  pg18-build:
  pg19-build:
