name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that only edits Markdown skips the jobs below; they
  # stay required and report as skipped. If classification fails the
  # output is empty and everything runs.
  changes:
    name: Classify the change
    uses: ./.github/workflows/changes.yml

  external-profile:
    name: External Compose profile
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate Compose definition
        run: docker compose -f compose.external.yml config --quiet

      - name: Build pinned demo image
        run: docker compose -f compose.external.yml build

      - name: Test profile rendering in demo image
        run: |
          docker run --rm -v "$PWD:/source:ro" pg-oauth-validator-demo:pg18 \
            /bin/sh -c 'cd /source && PYTHONDONTWRITEBYTECODE=1 python3 -m pytest -p no:cacheprovider -q tests/demo_profile_test.py'

      - name: Smoke-test external Compose stack
        run: |
          cp demo/provider.example.yml "$RUNNER_TEMP/provider.yml"
          export OAUTH_PROFILE="$RUNNER_TEMP/provider.yml"
          trap 'docker compose -p external-profile-ci -f compose.external.yml down --volumes --remove-orphans' EXIT
          docker compose -p external-profile-ci -f compose.external.yml up -d --wait --wait-timeout 90
          docker compose -p external-profile-ci -f compose.external.yml run --rm psql --version

  build:
    name: PostgreSQL ${{ matrix.pg }} / ${{ matrix.compiler }} / C17
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: "18"
            package: "18"
            target: "test-pg18"
            compiler: GCC
            cc: gcc
            image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
          - pg: "18"
            package: "18"
            target: "test-pg18"
            compiler: Clang
            cc: clang
            image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
          - pg: "19 RC1"
            package: "19"
            target: "test-pg19"
            compiler: GCC
            cc: gcc
            image: postgres:19rc1-bookworm@sha256:228dc3e5a9bd18343efeecc7ae3f52aee9b6cf3a9dca5159ece1eef254a80f06
          - pg: "19 RC1"
            package: "19"
            target: "test-pg19"
            compiler: Clang
            cc: clang
            image: postgres:19rc1-bookworm@sha256:228dc3e5a9bd18343efeecc7ae3f52aee9b6cf3a9dca5159ece1eef254a80f06
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Check out repository
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install build dependencies
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: ./scripts/ci/install-debian-dependencies.sh ${{ matrix.package }}

      - name: Install pinned PIC static Jansson dependency
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: CC=${{ matrix.cc }} ./scripts/ci/install-jansson.sh

      - name: Install pinned libjwt spike dependency
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: CC=${{ matrix.cc }} ./scripts/ci/install-libjwt.sh

      - name: Validate libjwt behavior under sanitizers
        if: ${{ needs.changes.outputs.docs_only != 'true' && (matrix.pg == '19 RC1' && matrix.compiler == 'Clang') }}
        run: |
          make sanitizercheck
          make fuzz-smoke
          make clean

      - name: Build and test in isolated tree
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: make ${{ matrix.target }} CC=${{ matrix.cc }}

      - name: Validate staged and installed package
        if: ${{ needs.changes.outputs.docs_only != 'true' && (matrix.compiler == 'GCC') }}
        run: make installedcheck

      - name: Clean build products
        if: ${{ needs.changes.outputs.docs_only != 'true' && (always()) }}
        run: |
          make clean-pg${{ matrix.package }}
          make clean

  # The PAM module is a separate, opt-in artifact (ADR 0008) supported on
  # PostgreSQL 15 to 19. Each major gets its own build tree and real-connection
  # tests; PostgreSQL 18 and 19 also run with the native validator installed.
  pam:
    name: PAM module / PostgreSQL ${{ matrix.pg }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: "15"
            image: postgres:15.19-bookworm@sha256:19b8449e2187e8a174b40c8832a7ed9da45813b74c2779b1c614e7e7d0ee47f0
            both: false
          - pg: "16"
            image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
            both: false
          - pg: "17"
            image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
            both: false
          - pg: "18"
            image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
            both: true
          - pg: "19"
            image: postgres:19rc1-bookworm@sha256:228dc3e5a9bd18343efeecc7ae3f52aee9b6cf3a9dca5159ece1eef254a80f06
            both: true
    container:
      image: ${{ matrix.image }}
    env:
      # The PAM tests write a service file under /etc/pam.d and need root, so
      # they refuse to run anywhere but an explicitly marked disposable container.
      OAUTH_TEST_PAM_DISPOSABLE: "1"

    steps:
      - name: Check out repository
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install build dependencies
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: ./scripts/ci/install-debian-dependencies.sh ${{ matrix.pg }}

      - name: Install pinned PIC static Jansson dependency
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: ./scripts/ci/install-jansson.sh

      - name: Install pinned libjwt dependency
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: ./scripts/ci/install-libjwt.sh

      - name: Build and test the PAM module
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: make pam-check-pg${{ matrix.pg }}

      - name: Test the native validator and PAM module together
        if: ${{ needs.changes.outputs.docs_only != 'true' && (matrix.both) }}
        run: make pam-both-check-pg${{ matrix.pg }}

      - name: Clean build products
        if: ${{ needs.changes.outputs.docs_only != 'true' && (always()) }}
        run: make clean

  # The pinned PostgreSQL images do not ship Git, so actions/checkout falls back
  # to a source tarball there and the container jobs have no working tree. Run
  # the Git-dependent hygiene checks on the runner, which has Git and Python.
  hygiene:
    name: Source hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Invoke the script directly: the make target loads PGXS, which this job
      # deliberately does not depend on.
      - name: Check source-tree hygiene
        run: ./scripts/ci/check-source-tree.sh

      - name: Test the documentation-only change classifier
        run: python3 tests/ci/test_classify_change.py

  quality:
    name: C formatting and Clang static analysis
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: postgres:19rc1-bookworm@sha256:228dc3e5a9bd18343efeecc7ae3f52aee9b6cf3a9dca5159ece1eef254a80f06

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install analysis dependencies
        run: ./scripts/ci/install-debian-dependencies.sh 19

      - name: Install pinned pgindent
        run: ./scripts/ci/install-pgindent.sh

      - name: Check C formatting
        run: make formatcheck

      - name: Install pinned PIC static Jansson dependency
        run: CC=clang ./scripts/ci/install-jansson.sh

      - name: Install pinned libjwt dependency
        run: CC=clang ./scripts/ci/install-libjwt.sh

      - name: Run Clang static analyzer
        run: |
          scan-build --status-bugs --keep-going -o .ci-analysis \
            make verify CC=clang

      - name: Run Clang static analyzer on the PAM module
        run: |
          scan-build --status-bugs --keep-going -o .ci-analysis \
            make pam-module CC=clang

      - name: Upload static-analysis reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clang-static-analysis
          path: .ci-analysis
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean build products
        if: always()
        run: make clean
