name: Keycloak interoperability

on:
  workflow_dispatch:
  # Weekly on the default branch, and on pull requests that can change what the
  # suite exercises: provider behavior was last checked by hand once, and a
  # cache-policy change went untested against Keycloak until a release rehearsal.
  schedule:
    - cron: '23 4 * * 1'
  pull_request:
    paths:
      - '.github/workflows/keycloak-interop.yml'
      - 'shared/**'
      - 'validator/**'
      - 'tests/interop/**'
      - 'tests/integration/**'
      - 'scripts/interop/**'
      - 'scripts/ci/install-*.sh'
      - 'Makefile'

permissions:
  contents: read

concurrency:
  group: keycloak-interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keycloak-26-5:
    name: Keycloak 26.5.0 / PostgreSQL 19 RC1
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run isolated interoperability suite
        run: make interop-keycloak

      - name: Reject untracked build products
        if: always()
        run: test -z "$(git status --short)"
