name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release-candidate version (for example, 0.1.0-rc.1)
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: PostgreSQL ${{ matrix.pg }} release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: "18"
            package: "18"
            target: test-pg18
            image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
            wrong_package: "19"
          - pg: "19 RC1"
            package: "19"
            target: test-pg19
            image: postgres:19rc1-bookworm@sha256:228dc3e5a9bd18343efeecc7ae3f52aee9b6cf3a9dca5159ece1eef254a80f06
            wrong_package: "18"
    container:
      image: ${{ matrix.image }}

    steps:
      # Release packaging archives the exact recorded commit. Install Git
      # before checkout so the action does not fall back to an unversioned
      # source snapshot in the minimal PostgreSQL images.
      - name: Install Git for revision-preserving checkout
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates=20230311+deb12u1 \
            git=1:2.39.5-0+deb12u3

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify exact checked-out revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"

      - name: Install build and test dependencies
        run: ./scripts/ci/install-debian-dependencies.sh ${{ matrix.package }}

      - name: Install pinned PIC static Jansson dependency
        run: ./scripts/ci/install-jansson.sh

      - name: Install pinned libjwt dependency
        run: ./scripts/ci/install-libjwt.sh

      - name: Verify and test PostgreSQL ${{ matrix.pg }} build
        env:
          PG_CONFIG: /usr/lib/postgresql/${{ matrix.package }}/bin/pg_config
        run: |
          make ${{ matrix.target }} \
            PG18_CONFIG="$PG_CONFIG" \
            PG19_CONFIG="$PG_CONFIG"

      - name: Derive reproducible build timestamp
        run: |
          source_date_epoch=$(git show -s --format=%ct HEAD)
          test -n "$source_date_epoch"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"

      - name: Build release-candidate package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_OUTPUT: dist/first/pg${{ matrix.package }}
          PG_CONFIG: /usr/lib/postgresql/${{ matrix.package }}/bin/pg_config
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          make release-package \
            RELEASE_VERSION="$RELEASE_VERSION" \
            SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            SOURCE_REVISION="$SOURCE_REVISION" \
            PG_CONFIG="$PG_CONFIG" \
            RELEASE_OUTPUT="$RELEASE_OUTPUT"

      - name: Rebuild package in a fresh build tree
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_OUTPUT: dist/second/pg${{ matrix.package }}
          PG_CONFIG: /usr/lib/postgresql/${{ matrix.package }}/bin/pg_config
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          make release-package \
            RELEASE_VERSION="$RELEASE_VERSION" \
            SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            SOURCE_REVISION="$SOURCE_REVISION" \
            PG_CONFIG="$PG_CONFIG" \
            RELEASE_OUTPUT="$RELEASE_OUTPUT"

      - name: Verify reproducibility and package identity
        env:
          FIRST_OUTPUT: dist/first/pg${{ matrix.package }}
          SECOND_OUTPUT: dist/second/pg${{ matrix.package }}
        run: |
          ./scripts/ci/check-release-artifacts.sh \
            "$FIRST_OUTPUT" "$SECOND_OUTPUT" "${{ matrix.package }}"
          if ./scripts/ci/check-release-artifacts.sh \
            "$FIRST_OUTPUT" "$SECOND_OUTPUT" "${{ matrix.wrong_package }}"; then
            echo "error: package accepted for the wrong PostgreSQL major" >&2
            exit 1
          fi

      # The PAM suite normally runs against a module built from the tree. This
      # runs it against the module inside the archive that will be published,
      # in the same pinned image that built it. The wrong-major test needs a
      # second module built with another expected major, which an archive does
      # not contain; the PAM module CI jobs cover it.
      - name: Test the PAM module extracted from the archive
        env:
          OAUTH_TEST_PAM_DISPOSABLE: "1"
          RELEASE_OUTPUT: dist/first/pg${{ matrix.package }}
          PG_CONFIG: /usr/lib/postgresql/${{ matrix.package }}/bin/pg_config
        run: |
          set -eu
          archive=$(find "$RELEASE_OUTPUT" -maxdepth 1 -name '*.tar.gz')
          test "$(printf '%s\n' "$archive" | wc -l)" -eq 1
          extract=$(mktemp -d)
          tar -xzf "$archive" -C "$extract"
          module=$(find "$extract" -name pg_oauth_pam.so)
          test "$(printf '%s\n' "$module" | wc -l)" -eq 1
          sha256sum "$module"
          PAM_MODULE="$module" PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" \
            python3 -m pytest -q -o cache_dir="$RUNNER_TEMP/pytest-cache" tests/pam \
            -k 'not test_a_module_built_for_another_major_never_authenticates'

      - name: Record release evidence
        env:
          RELEASE_OUTPUT: dist/first/pg${{ matrix.package }}
          PG_CONFIG: /usr/lib/postgresql/${{ matrix.package }}/bin/pg_config
          BUILD_IMAGE: ${{ matrix.image }}
        run: |
          ./scripts/ci/write-release-evidence.sh \
            "$RELEASE_OUTPUT/RELEASE-EVIDENCE.md" \
            "$RELEASE_OUTPUT" "$BUILD_IMAGE" "$PG_CONFIG"

      - name: Upload package, checksum, and build manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pg-oauth-validator-${{ inputs.version }}-pg${{ matrix.package }}
          path: |
            dist/first/pg${{ matrix.package }}/*.tar.gz
            dist/first/pg${{ matrix.package }}/*.tar.gz.sha256
            dist/first/pg${{ matrix.package }}/*.tar.gz.manifest
            dist/first/pg${{ matrix.package }}/RELEASE-EVIDENCE.md
          if-no-files-found: error
          retention-days: 14

  interoperability:
    name: Keycloak interoperability and recovery rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run pinned Keycloak interoperability suite
        run: sh ./scripts/interop/keycloak.sh

      - name: Reject generated or leaked source-tree files
        if: always()
        run: sh ./scripts/ci/check-source-tree.sh
